<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Haider — Data Analyst</title>
<meta name="description" content="Muhammad Haider — Data Analyst. Python, SQL, dashboards, NLP. Final-year CS, SMIU Karachi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --paper:#F3F1EA;
    --paper-raised:#ECE9E0;
    --navy:#10233F;
    --navy-deep:#0A1730;
    --gold:#C9A227;
    --gold-soft:#E4CD7C;
    --teal:#3E7C74;
    --teal-soft:#6FA79F;
    --ink:#20242B;
    --ink-soft:#5B6470;
    --line:rgba(16,35,63,0.14);
    --line-soft:rgba(16,35,63,0.07);
    --serif:'Fraunces', serif;
    --sans:'IBM Plex Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); line-height:1.55;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background-image:
      linear-gradient(rgba(16,35,63,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(16,35,63,0.028) 1px, transparent 1px);
    background-size:40px 40px;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .wrap{max-width:1200px; margin:0 auto; padding:0 40px; position:relative;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  /* scroll progress */
  #scrollBar{position:fixed; top:0; left:0; height:2px; width:0;
    background:linear-gradient(90deg, var(--gold), var(--teal)); z-index:100; transition:width .08s;}

  /* ============ TOP NAV ============ */
  header.nav{
    position:sticky; top:0; z-index:50;
    background:rgba(243,241,234,0.82);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1200px; margin:0 auto; padding:14px 40px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  @media (max-width:640px){ .nav-inner{padding:12px 20px;} }
  .brand{display:flex; align-items:center; gap:11px; flex-shrink:0;}
  .brand-mark{
    width:32px; height:32px; border-radius:7px;
    background:var(--navy); display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft); font-family:var(--mono); font-weight:600; font-size:0.85rem;
    position:relative; overflow:hidden;
  }
  .brand-mark::after{content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, transparent 55%, rgba(201,162,39,0.25));
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-name{font-family:var(--serif); font-weight:600; font-size:0.98rem; color:var(--navy);}
  .brand-sub{font-family:var(--mono); font-size:0.6rem; color:var(--ink-soft); letter-spacing:0.07em; text-transform:uppercase;}

  .nav-links{display:flex; gap:4px; align-items:center;}
  .nav-links a{
    font-size:0.87rem; color:var(--ink-soft); padding:8px 13px; border-radius:6px;
    position:relative; transition:color .18s, background .18s;
  }
  .nav-links a:hover{color:var(--navy); background:rgba(16,35,63,0.05);}
  .nav-links a.active{color:var(--navy); background:rgba(201,162,39,0.12);}

  .nav-cta{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 16px; background:var(--navy); color:var(--paper);
    border-radius:6px; font-size:0.83rem; font-weight:500;
    transition:background .18s, transform .18s; flex-shrink:0;
  }
  .nav-cta:hover{background:var(--navy-deep); transform:translateY(-1px);}
  @media (max-width:860px){ .nav-links{display:none;} }

  /* ============ HERO ============ */
  .hero{padding:56px 0 48px; position:relative; overflow:hidden;}
  .hero-grid{display:grid; grid-template-columns:1.05fr 1.15fr; gap:56px; align-items:center;}
  @media (max-width:980px){ .hero-grid{grid-template-columns:1fr; gap:36px;} }

  .eyebrow{
    display:inline-flex; align-items:center; gap:9px;
    padding:5px 12px; border-radius:100px;
    background:rgba(62,124,116,0.1); border:1px solid rgba(62,124,116,0.25);
    font-family:var(--mono); font-size:0.68rem; color:var(--teal);
    letter-spacing:0.04em; text-transform:uppercase; margin-bottom:20px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--teal);
    box-shadow:0 0 0 0 rgba(62,124,116,0.6); animation:ping 2.2s ease-out infinite;}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(62,124,116,0.55);} 100%{box-shadow:0 0 0 9px rgba(62,124,116,0);}}

  .hero h1{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(2.1rem, 3.6vw, 3rem);
    color:var(--navy); line-height:1.06; letter-spacing:-0.015em;
    max-width:16ch;
  }
  .hero h1 .accent{
    background:linear-gradient(transparent 68%, rgba(201,162,39,0.45) 68%);
  }
  .hero .lede{
    margin-top:20px; font-size:1.04rem; color:var(--ink-soft); max-width:44ch;
  }
  .hero-ctas{display:flex; gap:11px; margin-top:28px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 20px; border-radius:6px; font-size:0.9rem; font-weight:500;
    border:1px solid var(--navy); transition:background .18s, color .18s, transform .18s;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-solid{background:var(--navy); color:var(--paper);}
  .btn-solid:hover{background:var(--navy-deep);}
  .btn-ghost{color:var(--navy);}
  .btn-ghost:hover{background:var(--navy); color:var(--paper);}
  .btn i{font-size:0.8rem;}

  .hero-stats{
    display:flex; gap:28px; margin-top:32px; padding-top:24px;
    border-top:1px solid var(--line);
  }
  .hero-stat .hs-num{font-family:var(--mono); font-weight:600; color:var(--navy);
    font-size:1.5rem; line-height:1;}
  .hero-stat .hs-num .suffix{font-size:0.9rem; color:var(--gold);}
  .hero-stat .hs-lbl{font-family:var(--mono); font-size:0.65rem; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.06em; margin-top:5px;}

  /* ============ HERO DASHBOARD ============ */
  .hero-dash{
    background:var(--navy); border-radius:12px; padding:20px 22px 18px;
    box-shadow:0 30px 70px -28px rgba(16,35,63,0.55), 0 0 0 1px rgba(228,205,124,0.1) inset;
    position:relative; overflow:hidden;
  }
  .hero-dash::before{
    content:''; position:absolute; top:-120px; right:-120px; width:300px; height:300px;
    border-radius:50%; background:radial-gradient(circle, rgba(201,162,39,0.14), transparent 70%);
    pointer-events:none;
  }
  .hero-dash::after{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0.5;
    background-image:
      linear-gradient(rgba(228,205,124,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(228,205,124,0.05) 1px, transparent 1px);
    background-size:26px 26px;
  }
  .hero-dash > *{position:relative; z-index:1;}

  .dash-topbar{
    display:flex; align-items:center; gap:7px; padding-bottom:14px;
    border-bottom:1px solid rgba(243,241,234,0.09); margin-bottom:16px;
  }
  .dash-topbar .win-dot{width:9px; height:9px; border-radius:50%; background:rgba(243,241,234,0.18);}
  .dash-topbar .win-dot:first-child{background:var(--gold);}
  .dash-topbar .dash-title{
    margin-left:auto; font-family:var(--mono); font-size:0.66rem;
    color:rgba(243,241,234,0.5); letter-spacing:0.08em; text-transform:uppercase;
  }
  .dash-topbar .live{
    display:inline-flex; align-items:center; gap:5px; margin-left:14px;
    font-family:var(--mono); font-size:0.6rem; color:var(--teal-soft);
  }
  .dash-topbar .live .d{width:5px; height:5px; border-radius:50%; background:var(--teal-soft);
    animation:ping 1.8s infinite;}

  .dash-kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .dash-kpi{
    background:rgba(243,241,234,0.045); border:1px solid rgba(243,241,234,0.08);
    border-radius:7px; padding:11px 13px;
  }
  .dash-kpi .dk-label{font-family:var(--mono); font-size:0.58rem;
    color:rgba(243,241,234,0.5); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:6px;}
  .dash-kpi .dk-val{font-family:var(--mono); font-weight:600; color:var(--gold-soft);
    font-size:1.35rem; line-height:1;}
  .dash-kpi .dk-val .sfx{font-size:0.8rem; opacity:0.7; font-weight:500;}
  .dash-kpi .dk-bar{height:3px; background:rgba(243,241,234,0.08); border-radius:100px; margin-top:8px; overflow:hidden;}
  .dash-kpi .dk-bar span{display:block; height:100%; width:0;
    background:linear-gradient(90deg, var(--gold), var(--teal-soft));
    border-radius:100px; transition:width 1.4s cubic-bezier(.22,1,.36,1);}

  .dash-charts{display:grid; grid-template-columns:1.55fr 1fr; gap:10px;}
  .dash-chart{
    background:rgba(243,241,234,0.03); border:1px solid rgba(243,241,234,0.07);
    border-radius:7px; padding:12px 13px;
  }
  .dash-chart .dc-cap{font-family:var(--mono); font-size:0.58rem;
    color:rgba(243,241,234,0.5); letter-spacing:0.06em; text-transform:uppercase;
    margin-bottom:9px; display:flex; justify-content:space-between;}
  .dash-chart .dc-cap .dc-val{color:var(--gold-soft);}
  .dash-chart canvas{width:100% !important;}
  .dash-chart.bars canvas{height:130px !important;}
  .dash-chart.donut canvas{height:130px !important;}

  /* ============ SECTION HEADER ============ */
  section{padding:72px 0;}
  .sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    margin-bottom:36px; padding-bottom:18px; border-bottom:1px solid var(--line);
    flex-wrap:wrap;}
  .sec-head-left .sec-num{font-family:var(--mono); font-size:0.68rem; color:var(--gold);
    letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px;}
  .sec-head-left h2{font-family:var(--serif); font-weight:600; color:var(--navy);
    font-size:clamp(1.6rem, 2.6vw, 2.1rem); letter-spacing:-0.01em; line-height:1.15;}
  .sec-head-left p{color:var(--ink-soft); font-size:0.98rem; margin-top:8px; max-width:56ch;}
  .sec-head-right{font-family:var(--mono); font-size:0.7rem; color:var(--ink-soft);
    text-align:right; white-space:nowrap;}

  /* ============ ABOUT ============ */
  .about-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:48px; align-items:start;}
  @media (max-width:900px){ .about-grid{grid-template-columns:1fr; gap:32px;} }

  .about-prose p{font-size:1rem; color:var(--ink); max-width:64ch;}
  .about-prose p + p{margin-top:16px;}
  .about-prose .hl{background:linear-gradient(transparent 62%, rgba(201,162,39,0.4) 62%); padding:0 2px;}

  .about-side{display:flex; flex-direction:column; gap:14px;}
  .photo-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:22px; display:flex; align-items:center; gap:18px; position:relative; overflow:hidden;
  }
  .photo-card::before{content:''; position:absolute; top:-60px; right:-60px; width:160px; height:160px;
    border-radius:50%; background:radial-gradient(circle, rgba(201,162,39,0.14), transparent 70%);}
  .photo-wrap{position:relative; width:88px; height:88px; flex-shrink:0;}
  .photo-ring{position:absolute; inset:-4px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), var(--teal-soft), var(--gold));
    opacity:0.85; animation:spin 8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .photo-inner{position:absolute; inset:0; border-radius:50%; overflow:hidden;
    background:var(--paper); border:3px solid var(--paper-raised);}
  .photo-inner img{width:100%; height:100%; object-fit:cover;}
  .photo-info{position:relative; z-index:1; min-width:0;}
  .photo-info .pi-name{font-family:var(--serif); font-weight:600; color:var(--navy); font-size:1.05rem;}
  .photo-info .pi-role{font-family:var(--mono); font-size:0.68rem; color:var(--ink-soft); margin-top:3px;
    text-transform:uppercase; letter-spacing:0.05em;}
  .photo-info .pi-status{display:inline-flex; align-items:center; gap:6px; margin-top:9px;
    font-family:var(--mono); font-size:0.65rem; color:var(--teal);
    padding:3px 9px; border-radius:100px; background:rgba(62,124,116,0.1);
    border:1px solid rgba(62,124,116,0.22);}
  .photo-info .pi-status .d{width:5px; height:5px; border-radius:50%; background:var(--teal);
    animation:ping 2s infinite;}

  .mini-facts{background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:18px 22px;}
  .mini-facts .mf-title{font-family:var(--mono); font-size:0.64rem; color:var(--ink-soft);
    letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px;}
  .mf-row{display:flex; justify-content:space-between; align-items:baseline;
    padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:0.88rem;}
  .mf-row:last-child{border-bottom:none; padding-bottom:0;}
  .mf-row .mf-k{color:var(--ink-soft); font-size:0.83rem;}
  .mf-row .mf-v{font-family:var(--mono); color:var(--navy); font-weight:500; font-size:0.85rem;}

  /* ============ EXPERIENCE ============ */
  .exp-list{display:flex; flex-direction:column; gap:16px;}
  .exp-card{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:24px 26px; display:grid; grid-template-columns:180px 1fr; gap:28px;
    transition:border-color .2s, box-shadow .2s, transform .2s;
    position:relative; overflow:hidden;
  }
  .exp-card:hover{border-color:rgba(201,162,39,0.5); transform:translateY(-2px);
    box-shadow:0 16px 32px -22px rgba(16,35,63,0.35);}
  .exp-card::before{content:''; position:absolute; left:0; top:24px; bottom:24px; width:3px;
    background:linear-gradient(var(--gold), var(--teal)); border-radius:0 3px 3px 0;
    opacity:0; transition:opacity .25s;}
  .exp-card:hover::before{opacity:1;}
  @media (max-width:760px){ .exp-card{grid-template-columns:1fr; gap:14px;} }

  .exp-meta .em-date{font-family:var(--mono); font-size:0.72rem; color:var(--teal);
    background:rgba(62,124,116,0.1); padding:3px 10px; border-radius:100px; display:inline-block;}
  .exp-meta .em-type{font-family:var(--mono); font-size:0.66rem; color:var(--ink-soft);
    margin-top:10px; letter-spacing:0.04em; text-transform:uppercase;}

  .exp-body h3{font-family:var(--serif); font-weight:600; color:var(--navy); font-size:1.15rem;}
  .exp-body .eb-org{font-size:0.9rem; color:var(--ink-soft); margin-top:3px; margin-bottom:12px;}
  .exp-body ul{margin-left:18px; font-size:0.93rem; color:var(--ink);}
  .exp-body li{margin-bottom:4px;}
  .exp-tags{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;}
  .exp-tag{font-family:var(--mono); font-size:0.67rem; color:var(--navy);
    background:var(--paper-raised); border:1px solid var(--line); padding:3px 9px; border-radius:3px;}

  /* ============ PROJECTS ============ */
  .proj-toolbar{display:flex; gap:7px; margin-bottom:20px; flex-wrap:wrap; align-items:center;}
  .chip{font-family:var(--mono); font-size:0.72rem; padding:6px 13px; border-radius:100px;
    border:1px solid var(--line); color:var(--ink-soft); transition:all .18s; background:var(--paper);}
  .chip:hover{border-color:rgba(201,162,39,0.5); color:var(--navy);}
  .chip.active{background:var(--navy); color:var(--paper); border-color:var(--navy);}
  .proj-count{margin-left:auto; font-family:var(--mono); font-size:0.7rem; color:var(--ink-soft);}

  .proj-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  @media (max-width:820px){ .proj-grid{grid-template-columns:1fr;} }

  .proj-card{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:22px 24px; position:relative; overflow:hidden; cursor:pointer;
    transition:border-color .2s, transform .2s, box-shadow .2s;
    display:flex; flex-direction:column;
  }
  .proj-card:hover{border-color:rgba(201,162,39,0.55); transform:translateY(-3px);
    box-shadow:0 18px 38px -22px rgba(16,35,63,0.4);}
  .proj-card::before{content:''; position:absolute; inset:0; border-radius:10px;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(201,162,39,0.08), transparent 60%);
    opacity:0; transition:opacity .3s; pointer-events:none;}
  .proj-card:hover::before{opacity:1;}

  .proj-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:12px;}
  .proj-title{font-family:var(--serif); font-weight:600; color:var(--navy); font-size:1.08rem; line-height:1.25;}
  .proj-cat{font-family:var(--mono); font-size:0.6rem; padding:3px 8px; border-radius:3px;
    background:var(--paper-raised); color:var(--ink-soft); border:1px solid var(--line);
    text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap;}
  .proj-desc{font-size:0.9rem; color:var(--ink-soft); line-height:1.55; flex:1;}
  .proj-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px;
    padding-top:14px; border-top:1px solid var(--line-soft); gap:12px;}
  .proj-tags{display:flex; gap:5px; flex-wrap:wrap;}
  .proj-tag{font-family:var(--mono); font-size:0.66rem; color:var(--ink-soft);
    background:var(--paper-raised); padding:2px 7px; border-radius:3px; border:1px solid var(--line-soft);}
  .proj-metric{font-family:var(--mono); font-size:0.72rem; color:var(--gold); font-weight:600;
    white-space:nowrap;}

  /* ============ SKILLS ============ */
  .skills-layout{display:grid; grid-template-columns:1.2fr 1fr; gap:20px;}
  @media (max-width:900px){ .skills-layout{grid-template-columns:1fr;} }

  .skill-panel{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:24px 26px;}
  .skill-panel h3{font-family:var(--mono); font-size:0.68rem; color:var(--ink-soft);
    letter-spacing:0.1em; text-transform:uppercase; margin-bottom:20px;}
  .skill-bars{display:flex; flex-direction:column; gap:16px;}
  .sk-bar .sk-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .sk-bar .sk-name{font-size:0.9rem; color:var(--navy); font-weight:500;}
  .sk-bar .sk-val{font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft);}
  .sk-bar .sk-track{height:7px; background:var(--paper-raised); border-radius:100px; overflow:hidden;}
  .sk-bar .sk-fill{height:100%; width:0; border-radius:100px;
    background:linear-gradient(90deg, var(--gold), var(--teal));
    transition:width 1.3s cubic-bezier(.22,1,.36,1);}

  .tool-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:9px;}
  .tool{background:var(--paper-raised); border:1px solid var(--line); border-radius:8px;
    padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:8px;
    font-size:0.72rem; color:var(--navy); text-align:center;
    transition:border-color .18s, transform .18s, background .18s;}
  .tool i{font-size:1.3rem; color:var(--navy); transition:color .18s, transform .18s;}
  .tool:hover{border-color:var(--gold); transform:translateY(-3px); background:var(--paper);}
  .tool:hover i{color:var(--gold); transform:scale(1.12);}

  /* ============ CERTS + CONTACT ============ */
  .bottom-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:900px){ .bottom-grid{grid-template-columns:1fr;} }

  .cert-panel{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:24px 26px;}
  .cert-panel h3{font-family:var(--mono); font-size:0.68rem; color:var(--ink-soft);
    letter-spacing:0.1em; text-transform:uppercase; margin-bottom:18px;}
  .cert{display:flex; align-items:center; gap:14px; padding:13px 0;
    border-bottom:1px solid var(--line-soft); transition:padding-left .2s;}
  .cert:last-child{border-bottom:none; padding-bottom:0;}
  .cert:hover{padding-left:6px;}
  .cert-ico{width:36px; height:36px; border-radiu
